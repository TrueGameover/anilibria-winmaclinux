name: Debian package build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  debianPackageBuild:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source code
      uses: actions/checkout@v5

    - name: Set version from tag
      run: |
        VERSION="${{ github.ref_name }}"
        VERSION="${VERSION#v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
        dpkg-dev \
        libmpv-dev pkg-config qt6-base-dev qt6-declarative-dev \
        qt6-websockets-dev qt6-svg-dev libxkbcommon-dev \
        qml6-module-qt-labs-folderlistmodel qml6-module-qt-labs-platform \
        qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-models \
        qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
        qml6-module-qtquick-layouts qml6-module-qtquick-particles qml6-module-qtquick-window \
        qml6-module-qtqml-workerscript qml6-module-qtquick-templates

    - name: Program build
      run: |
        cmake src -B src/build -DCMAKE_BUILD_TYPE=Release -DANILIBERTY_LESS_68_QT=On
        cmake --build src/build -j$(nproc)

    - name: Fix empty dir
      run: mkdir -p specs/deb/usr/bin/

    - name: Copy program to deb-package
      run: cp src/build/AniLiberty specs/deb/usr/bin/aniliberty

    - name: Compute runtime dependencies
      run: |
        mkdir -p /tmp/shlibdeps-analysis/debian
        cat > /tmp/shlibdeps-analysis/debian/control <<'EOF'
        Source: aniliberty
        Section: video
        Priority: optional
        Maintainer: https://github.com/anilibria

        Package: aniliberty
        Architecture: amd64
        Depends: ${shlibs:Depends}
        Description: control stub for dependency analysis
        EOF
        SHLIBS="$(cd /tmp/shlibdeps-analysis && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/specs/deb/usr/bin/aniliberty" | sed -n 's/^shlibs:Depends=//p')"
        if [ -z "$SHLIBS" ]; then
          echo "ERROR: dpkg-shlibdeps returned no shlibs:Depends" >&2
          exit 1
        fi
        echo "Computed runtime deps: $SHLIBS"
        sed -i "s|\${shlibs:Depends}|$SHLIBS|" specs/deb/DEBIAN/control

    - name: Update version in Debian control
      run: |
        if [ ! -f specs/deb/DEBIAN/control ]; then
          echo "Error: specs/deb/DEBIAN/control not found"
          exit 1
        fi
        sed -i "s/^Version:.*/Version: ${{ env.VERSION }}/" specs/deb/DEBIAN/control

    - name: Update installed size in Debian control
      run: |
        INSTALLED_SIZE="$(du -sk specs/deb/usr | cut -f1)"
        echo "Installed size: $INSTALLED_SIZE Kb"
        sed -i "s/^Installed-Size:.*/Installed-Size: $INSTALLED_SIZE/" specs/deb/DEBIAN/control

    - name: Build deb-package
      run: dpkg-deb --build specs/deb/ aniliberty_${{ env.VERSION }}_amd64.deb

    - name: Verify package dependencies
      run: |
        DEPS="$(dpkg-deb --field aniliberty_${{ env.VERSION }}_amd64.deb Depends)"
        echo "Depends: $DEPS"
        if echo "$DEPS" | grep -Eq -- '-dev|pkg-config|\$\{shlibs'; then
          echo "ERROR: runtime package must not depend on build-time packages" >&2
          exit 1
        fi

    - name: Upload package artifact
      uses: actions/upload-artifact@v5
      with:
        name: aniliberty-deb
        path: aniliberty_${{ env.VERSION }}_amd64.deb
